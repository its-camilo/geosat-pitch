<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GeoSAT — Sistema de Alerta Temprana para Erosión Costera" />
    <title>GeoSAT — Pitch Hackatón 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body>

    <canvas id="three-canvas"></canvas>

    <div class="chrome" id="brand">
      <span class="mark"></span>
      <span>GEOSAT · v1.0</span>
    </div>

    <div class="chrome" id="meta">
      <span class="live">EN VIVO</span>
      <span>DIBULLA · LA GUAJIRA</span>
      <span>11.5° N / 73.3° W</span>
    </div>

    <div class="chrome" id="progress-bar">
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-label">
        <span class="current" id="currentSection">01</span>
        <span> / 06 · </span>
        <span id="currentTitle">EL PROBLEMA</span>
      </div>
    </div>

    <nav id="dots" aria-label="Navegación de secciones">
      <button data-idx="0" class="active" title="El Problema"></button>
      <button data-idx="1" title="La Solución"></button>
      <button data-idx="2" title="Inclusión Social"></button>
      <button data-idx="3" title="Arquitectura Técnica"></button>
      <button data-idx="4" title="Viabilidad"></button>
      <button data-idx="5" title="Cierre"></button>
    </nav>

    <div class="scroll-container">
      <div class="horizontal-wrapper">
        <!-- slides injected by src/slides.js -->
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/scene.js"></script>
  </body>
</html>
