<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GeoSAT — Sistema de Alerta Temprana para Erosión Costera" />
    <title>GeoSAT — Pitch HACKATHON 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,300;0,6..12,400;0,6..12,600;0,6..12,700;0,6..12,800;1,6..12,400&display=swap" rel="stylesheet">

    <canvas id="three-canvas"></canvas>

    <div class="chrome" id="brand">

      <span class="live">EN VIVO</span>
      <span>DIBULLA · LA GUAJIRA</span>

    <div class="chrome" id="progress-bar">
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-label">
        <span class="current" id="currentSection">01</span>
        <span> / 06 · </span>
        <span id="currentTitle">EL PROBLEMA</span>
      </div>
    </div>

    <div class="scroll-container">
      <div class="horizontal-wrapper">
        <!-- slides injected by src/slides.js -->
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
